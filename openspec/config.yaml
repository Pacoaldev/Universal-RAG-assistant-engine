# OpenSpec project context — Universal RAG assistant engine
# Generated by orchestrator after subagent sdd-init failure (model route 9router/Free-Minions unavailable).

schema: openspec.config/v1
project: universal-rag-assistant-engine
artifact_store: openspec
change_root: openspec/changes

strict_tdd: true
test_runner: pytest
test_command: pytest
test_async_mode: auto  # pytest-asyncio configured

# Per-phase rules
phase_rules:
  explore:
    requires: []
    produces: [exploration-notes]
  research:
    requires: []
    produces: [research-notes]
    optional: true
  proposal:
    requires: []
    produces: [proposal.md]
  spec:
    requires: [proposal.md]
    produces: [specs/*.md]
  design:
    requires: [proposal.md]
    produces: [design.md]
  tasks:
    requires: [specs/*.md, design.md]
    produces: [tasks.md]
  apply:
    requires: [tasks.md]
    produces: [apply-progress.md]
  verify:
    requires: [apply-progress.md]
    produces: [verify-report.md]
    optional: true
  archive:
    requires: [tasks.md]
    produces: []

# Skill registry location
skill_registry: .atl/skill-registry.md

# Conventions
language_default: en
review_budget_lines: 400
delivery_strategy_default: ask-on-risk