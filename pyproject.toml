[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-rag-assistant-engine"
version = "1.0.0"
description = "Production-grade, modular RAG assistant engine with multi-storage and multi-LLM backends"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Paco Alcaide", email = "pacoaldev@gmail.com" }
]
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "google-generativeai>=0.8.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "rich>=13.7.0",
    "firebase-admin>=6.5.0",
    "google-cloud-firestore>=2.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[project.scripts]
assistant-cli = "src.cli.main:main"
assistant-api = "src.api.app:start"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
asyncio_mode = "auto"
